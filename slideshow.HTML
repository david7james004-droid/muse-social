<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Slideshow | Muse</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root {
            --bg: #000; --text: #FFFFFF; --text-muted: #999999;
            --accent: #ADD8E6; --gold: #FFD700; --danger: #FF6B6B; --success: #4CAF50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; overflow: hidden;
        }
        .filter-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 10px 12px; display: flex; align-items: center; gap: 8px;
            max-width: 600px; margin: 0 auto; overflow-x: auto; white-space: nowrap;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px; border-radius: 20px; border: 1px solid #555;
            background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; font-family: inherit;
        }
        .filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .filter-chip:hover { border-color: var(--accent); }
        .filter-menu-btn {
            padding: 6px 12px; border-radius: 20px; border: 1px solid var(--gold);
            background: rgba(255,215,0,0.1); color: var(--gold); font-size: 0.75rem;
            cursor: pointer; flex-shrink: 0; font-family: inherit;
        }
        .filter-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 500; align-items: center; justify-content: center; padding: 20px;
        }
        .filter-modal-overlay.active { display: flex; }
        .filter-modal {
            background: #222; border-radius: 16px; padding: 20px; width: 100%;
            max-width: 500px; max-height: 80vh; overflow-y: auto;
        }
        .filter-modal h3 { color: var(--accent); text-align: center; margin-bottom: 16px; }
        .filter-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .filter-tag {
            padding: 8px 16px; border-radius: 20px; border: 1px solid #555;
            background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer;
            font-size: 0.8rem; transition: all 0.2s; font-family: inherit;
        }
        .filter-tag.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .filter-apply-btn { display: block; width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 25px; font-weight: 600; cursor: pointer; margin-top: 16px; font-family: inherit; font-size: 1rem; }
        .filter-clear-btn { display: block; width: 100%; padding: 10px; background: transparent; border: 1px solid #666; color: #ccc; border-radius: 25px; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .slides-container {
            height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .slide {
            scroll-snap-align: start; height: 100vh; display: flex;
            align-items: center; justify-content: center; position: relative; background: #000;
        }
        .slide-media { width: 100%; height: 100%; object-fit: contain; }
        .slide-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 80px 16px 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9));
            pointer-events: none;
        }
        .slide-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .slide-av {
            width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: #000; font-size: 1rem; overflow: hidden; border: 2px solid var(--gold);
        }
        .slide-av img { width: 100%; height: 100%; object-fit: cover; }
        .slide-username { font-weight: 600; font-size: 0.9rem; }
        .slide-flag { font-size: 0.8rem; }
        .slide-text { font-size: 0.85rem; color: #ddd; line-height: 1.4; }
        .slide-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
        .slide-tag { background: rgba(173,216,230,0.2); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        .slide-location { color: var(--text-muted); font-size: 0.7rem; margin-top: 4px; }
        .slide-actions {
            position: absolute; right: 12px; bottom: 100px;
            display: flex; flex-direction: column; gap: 16px; z-index: 10;
        }
        .slide-action-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .slide-action-btn:hover { background: rgba(255,255,255,0.2); }
        .slide-action-btn.liked { color: #FF6B6B; border-color: #FF6B6B; }
        .slide-action-btn.bookmarked { color: var(--gold); border-color: var(--gold); }
        .action-count { font-size: 0.65rem; text-align: center; color: #fff; margin-top: -12px; }
        .nav-arrow {
            position: fixed; right: 20px; z-index: 50;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
        .nav-up { top: 80px; }
        .nav-down { bottom: 160px; }
        .back-btn {
            position: fixed; top: 12px; left: 12px; z-index: 150;
            background: rgba(0,0,0,0.6); border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
        .slide-counter {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 150; color: #fff; font-size: 0.8rem;
            background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px;
        }
        .slide-empty {
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #999; padding: 40px; text-align: center;
        }
        .slide-empty-icon { font-size: 4rem; margin-bottom: 16px; }
        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; z-index: 9999; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

<div class="filter-bar" id="filterBar">
    <button class="back-btn" onclick="window.location.href='centre.html'" style="position:static;flex-shrink:0;">←</button>
    <button class="filter-chip active" data-tag="all">All</button>
    <button class="filter-chip" data-tag="trending">🔥 Trending</button>
    <button class="filter-chip" data-tag="comedy">Comedy</button>
    <button class="filter-chip" data-tag="funny">Funny</button>
    <button class="filter-chip" data-tag="news">News</button>
    <button class="filter-chip" data-tag="animals">Animals</button>
    <button class="filter-chip" data-tag="sports">Sports</button>
    <button class="filter-chip" data-tag="music">Music</button>
    <button class="filter-menu-btn" id="filterMenuBtn">More ▼</button>
</div>

<div class="filter-modal-overlay" id="filterModal">
    <div class="filter-modal">
        <h3>Filter Content</h3>
        <div class="filter-grid" id="filterGrid">
            <button class="filter-tag" data-tag="all">All</button>
            <button class="filter-tag" data-tag="trending">🔥 Trending</button>
            <button class="filter-tag" data-tag="comedy">Comedy</button>
            <button class="filter-tag" data-tag="funny">Funny</button>
            <button class="filter-tag" data-tag="news">News</button>
            <button class="filter-tag" data-tag="animals">Animals</button>
            <button class="filter-tag" data-tag="fashion">Fashion</button>
            <button class="filter-tag" data-tag="celebs">Celebs</button>
            <button class="filter-tag" data-tag="hollywood">Hollywood</button>
            <button class="filter-tag" data-tag="football">Football</button>
            <button class="filter-tag" data-tag="nfl">NFL</button>
            <button class="filter-tag" data-tag="nba">NBA</button>
            <button class="filter-tag" data-tag="hockey">Hockey</button>
            <button class="filter-tag" data-tag="rugby">Rugby</button>
            <button class="filter-tag" data-tag="f1">F1</button>
            <button class="filter-tag" data-tag="motorsport">Motor-Sport</button>
            <button class="filter-tag" data-tag="action">Action</button>
            <button class="filter-tag" data-tag="thriller">Thriller</button>
            <button class="filter-tag" data-tag="horror">Horror</button>
            <button class="filter-tag" data-tag="tennis">Tennis</button>
            <button class="filter-tag" data-tag="workout">Work-Out</button>
            <button class="filter-tag" data-tag="diy">DIY</button>
            <button class="filter-tag" data-tag="garden">Garden</button>
            <button class="filter-tag" data-tag="nature">Nature</button>
            <button class="filter-tag" data-tag="shopping">Shopping</button>
            <button class="filter-tag" data-tag="beauty">Beauty</button>
            <button class="filter-tag" data-tag="food">Food</button>
            <button class="filter-tag" data-tag="pets">Pets</button>
            <button class="filter-tag" data-tag="sports">Sports</button>
            <button class="filter-tag" data-tag="music">Music</button>
            <button class="filter-tag" data-tag="gaming">Gaming</button>
            <button class="filter-tag" data-tag="tech">Tech</button>
            <button class="filter-tag" data-tag="travel">Travel</button>
        </div>
        <button class="filter-apply-btn" id="filterApplyBtn">Apply Filters</button>
        <button class="filter-clear-btn" id="filterClearBtn">Clear All</button>
    </div>
</div>

<div class="slide-counter" id="slideCounter">1 / 0</div>

<button class="nav-arrow nav-up" id="navUp">▲</button>
<button class="nav-arrow nav-down" id="navDown">▼</button>

<div class="slides-container" id="slidesContainer">
    <div class="slide-empty">
        <div class="slide-empty-icon">🎞️</div>
        <h2>Loading slides...</h2>
        <p>Content from friends appears here</p>
    </div>
</div>

<div id="toast"></div>

<script>
var API_BASE = 'http://localhost:3000/api';
var currentUser = null;
var allPosts = [];
var currentSlideIndex = 0;
var activeFilter = 'all';

document.addEventListener('DOMContentLoaded', function() {
    var stored = localStorage.getItem('muse_user');
    if (!stored) { window.location.href = 'index.html'; return; }
    currentUser = JSON.parse(stored);
    setupUI();
    loadSlides();
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown' || e.key === 'j') nextSlide();
        if (e.key === 'ArrowUp' || e.key === 'k') prevSlide();
        if (e.key === 'Escape') window.location.href = 'centre.html';
    });
});

function setupUI() {
    document.querySelectorAll('#filterBar .filter-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
            document.querySelectorAll('#filterBar .filter-chip').forEach(function(c) { c.classList.remove('active'); });
            this.classList.add('active');
            activeFilter = this.dataset.tag;
            filterSlides();
        });
    });
    
    document.getElementById('filterMenuBtn').addEventListener('click', function() {
        document.getElementById('filterModal').classList.add('active');
        document.querySelectorAll('#filterGrid .filter-tag').forEach(function(tag) {
            tag.classList.toggle('selected', tag.dataset.tag === activeFilter);
        });
    });
    
    document.getElementById('filterModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
    
    document.querySelectorAll('#filterGrid .filter-tag').forEach(function(tag) {
        tag.addEventListener('click', function() {
            document.querySelectorAll('#filterGrid .filter-tag').forEach(function(t) { t.classList.remove('selected'); });
            this.classList.add('selected');
        });
    });
    
    document.getElementById('filterApplyBtn').addEventListener('click', function() {
        var selected = document.querySelector('#filterGrid .filter-tag.selected');
        if (selected) {
            activeFilter = selected.dataset.tag;
            document.querySelectorAll('#filterBar .filter-chip').forEach(function(c) { c.classList.remove('active'); });
            var barChip = document.querySelector('#filterBar .filter-chip[data-tag="' + activeFilter + '"]');
            if (barChip) barChip.classList.add('active');
            filterSlides();
        }
        document.getElementById('filterModal').classList.remove('active');
    });
    
    document.getElementById('filterClearBtn').addEventListener('click', function() {
        activeFilter = 'all';
        document.querySelectorAll('#filterGrid .filter-tag').forEach(function(t) { t.classList.remove('selected'); });
        var allTag = document.querySelector('#filterGrid .filter-tag[data-tag="all"]');
        if (allTag) allTag.classList.add('selected');
        document.querySelectorAll('#filterBar .filter-chip').forEach(function(c) { c.classList.remove('active'); });
        var allChip = document.querySelector('#filterBar .filter-chip[data-tag="all"]');
        if (allChip) allChip.classList.add('active');
        filterSlides();
        document.getElementById('filterModal').classList.remove('active');
    });
    
    document.getElementById('navUp').addEventListener('click', prevSlide);
    document.getElementById('navDown').addEventListener('click', nextSlide);
    
    var container = document.getElementById('slidesContainer');
    var scrollTimeout;
    container.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            currentSlideIndex = Math.round(container.scrollTop / window.innerHeight);
            updateCounter();
            playCurrentVideo();
        }, 150);
    });
    
    var touchStartY = 0;
    container.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; });
    container.addEventListener('touchend', function(e) {
        var diff = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(diff) > 50) {
            if (diff > 0) nextSlide();
            else prevSlide();
        }
    });
}

function loadSlides() {
    var container = document.getElementById('slidesContainer');
    fetch(API_BASE + '/posts?type=slideshow')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success && result.posts && result.posts.length > 0) {
                allPosts = result.posts;
                filterSlides();
            } else {
                fetch(API_BASE + '/posts')
                    .then(function(r) { return r.json(); })
                    .then(function(allResult) {
                        if (allResult.success && allResult.posts) {
                            allPosts = allResult.posts.filter(function(p) { return p.media || p.slideshow; });
                            if (allPosts.length === 0) {
                                container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">🎞️</div><h2>No slides yet</h2><p>Posts with media sent to slideshow appear here</p><button onclick="window.location.href=\'centre.html\'" style="margin-top:16px;padding:12px 32px;background:#ADD8E6;color:#000;border:none;border-radius:25px;cursor:pointer;font-weight:600;">Go to Centre</button></div>';
                                return;
                            }
                            filterSlides();
                        }
                    });
            }
        })
        .catch(function() {
            container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">⚠️</div><h2>Cannot load slides</h2><p>Make sure the server is running</p><button onclick="loadSlides()" style="margin-top:12px;padding:10px 24px;background:#ADD8E6;color:#000;border:none;border-radius:20px;cursor:pointer;">Retry</button></div>';
        });
}

function filterSlides() {
    var container = document.getElementById('slidesContainer');
    var filtered = allPosts;
    
    if (activeFilter !== 'all') {
        filtered = allPosts.filter(function(p) {
            var text = (p.text || '').toLowerCase();
            return text.indexOf('#' + activeFilter) !== -1 || text.indexOf(activeFilter) !== -1;
        });
    }
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">🔍</div><h2>No ' + activeFilter + ' content</h2><p>Try a different filter</p></div>';
        return;
    }
    
    container.innerHTML = filtered.map(function(post, index) {
        var mediaFiles = post.media ? post.media.split(',') : [];
        var tags = (post.text || '').match(/#[\w-]+/g) || [];
        var locationMatch = (post.text || '').match(/📍\s*(.+)/);
        var location = locationMatch ? locationMatch[1] : '';
        
        return '<div class="slide" id="slide-' + index + '">' +
            (post.media_type === 'video' ? '<video class="slide-media" src="' + post.media + '" loop muted playsinline></video>' :
             mediaFiles[0] ? '<img class="slide-media" src="' + mediaFiles[0] + '" alt="Slide">' :
             '<div style="color:#999;text-align:center;padding:40px;">No media</div>') +
            '<div class="slide-actions">' +
                '<button class="slide-action-btn" onclick="likePost(\'' + post.id + '\', this)">❤️</button>' +
                '<div class="action-count">' + (post.likes_count || 0) + '</div>' +
                '<button class="slide-action-btn" onclick="bookmarkPost(\'' + post.id + '\', this)">🔖</button>' +
                '<button class="slide-action-btn" onclick="sharePost()">↗️</button>' +
                (post.user_id === currentUser.id ? '<button class="slide-action-btn" onclick="deleteSlide(\'' + post.id + '\')">🗑️</button>' : '') +
            '</div>' +
            '<div class="slide-overlay" onclick="toggleVideo(this.parentElement)">' +
                '<div class="slide-user-row">' +
                    '<div class="slide-av">' + (post.avatar ? '<img src="' + post.avatar + '">' : (post.tag_name || '?')[0].toUpperCase()) + '</div>' +
                    '<div><div class="slide-username">@' + post.tag_name + ' <span class="slide-flag">' + (post.country_flag || '') + '</span></div></div>' +
                '</div>' +
                '<div class="slide-text">' + (post.text || '') + '</div>' +
                (tags.length > 0 ? '<div class="slide-tags">' + tags.map(function(t) { return '<span class="slide-tag">' + t + '</span>'; }).join('') + '</div>' : '') +
                (location ? '<div class="slide-location">📍 ' + location + '</div>' : '') +
            '</div>' +
        '</div>';
    }).join('');
    
    currentSlideIndex = 0;
    container.scrollTop = 0;
    updateCounter();
    setTimeout(function() { playCurrentVideo(); }, 500);
}

function nextSlide() {
    var container = document.getElementById('slidesContainer');
    var maxIndex = container.querySelectorAll('.slide').length - 1;
    if (currentSlideIndex < maxIndex) {
        currentSlideIndex++;
        container.scrollTo({ top: currentSlideIndex * window.innerHeight, behavior: 'smooth' });
        updateCounter();
        setTimeout(function() { playCurrentVideo(); }, 500);
    }
}

function prevSlide() {
    if (currentSlideIndex > 0) {
        currentSlideIndex--;
        document.getElementById('slidesContainer').scrollTo({ top: currentSlideIndex * window.innerHeight, behavior: 'smooth' });
        updateCounter();
        setTimeout(function() { playCurrentVideo(); }, 500);
    }
}

function playCurrentVideo() {
    document.querySelectorAll('.slide video').forEach(function(v) { v.pause(); });
    var currentSlide = document.getElementById('slide-' + currentSlideIndex);
    if (currentSlide) {
        var video = currentSlide.querySelector('video');
        if (video) video.play().catch(function() {});
    }
}

function toggleVideo(slide) {
    var video = slide.querySelector('video');
    if (video) {
        if (video.paused) video.play().catch(function() {});
        else video.pause();
    }
}

function updateCounter() {
    var total = document.querySelectorAll('.slide').length;
    document.getElementById('slideCounter').textContent = (currentSlideIndex + 1) + ' / ' + total;
}

function likePost(postId, btn) {
    fetch(API_BASE + '/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, postId: postId })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.success) {
            btn.classList.toggle('liked', result.liked);
            var countEl = btn.nextElementSibling;
            if (countEl && countEl.classList.contains('action-count')) {
                var num = parseInt(countEl.textContent) || 0;
                countEl.textContent = result.liked ? num + 1 : Math.max(0, num - 1);
            }
            showToast(result.liked ? '❤️ Liked!' : 'Like removed');
        }
    });
}

function bookmarkPost(postId, btn) {
    fetch(API_BASE + '/bookmarks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, postId: postId })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.success) {
            btn.classList.toggle('bookmarked', result.bookmarked);
            showToast(result.bookmarked ? '🔖 Bookmarked!' : 'Bookmark removed');
        }
    });
}

function sharePost() {
    if (navigator.share) {
        navigator.share({ title: 'Muse Post', url: window.location.href });
    } else {
        showToast('Link copied!');
    }
}

function deleteSlide(postId) {
    if (!confirm('Delete this post?')) return;
    fetch(API_BASE + '/posts/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, postId: postId })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.success) { showToast('Deleted 🗑️'); loadSlides(); }
    });
}

function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
}
</script>
</body>
</html>
