<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#808080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Friends | Muse</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root {
            --bg: #808080; --bg-dark: #606060; --bg-darker: #404040;
            --bg-card: rgba(0,0,0,0.2); --text: #FFFFFF; --text-muted: #999999;
            --accent: #ADD8E6; --gold: #FFD700; --danger: #FF6B6B; --success: #4CAF50;
            --radius: 16px; --radius-sm: 8px; --footer-height: 70px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; padding-bottom: calc(var(--footer-height) + 100px);
        }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
        .top-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: var(--bg-dark); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1); height: 50px;
        }
        .nav-left { position: relative; }
        .muse-menu-btn { background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-logo-icon { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0; background: var(--bg-darker);
            border-radius: var(--radius-sm); min-width: 200px; max-height: 350px; overflow-y: auto;
            z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); list-style: none;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu li a {
            display: block; padding: 10px 16px; color: var(--text); text-decoration: none;
            font-size: 0.9rem; transition: background 0.2s;
        }
        .dropdown-menu li a:hover { background: var(--accent); color: #000; }
        .nav-center .page-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
        .nav-right { display: flex; gap: 8px; align-items: center; }
        .add-friend-bar { padding: 12px 16px; display: flex; gap: 8px; }
        .add-friend-input {
            flex: 1; padding: 10px 16px; background: rgba(255,255,255,0.08); border: 2px solid #666;
            border-radius: 25px; color: #fff; font-size: 0.9rem; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        .add-friend-input:focus { border-color: var(--accent); }
        .btn-add {
            padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: 25px;
            font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.9rem; white-space: nowrap;
        }
        .tabs { display: flex; gap: 4px; padding: 0 16px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1; padding: 8px; background: transparent; border: 1px solid #666; border-radius: 20px;
            color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .tab-badge { background: var(--danger); color: #fff; border-radius: 50%; padding: 2px 7px; font-size: 0.7rem; margin-left: 4px; }
        .friend-card {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            background: var(--bg-card); border-radius: var(--radius-sm); margin: 0 16px 8px;
            transition: background 0.2s;
        }
        .friend-av {
            width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: #000; font-size: 1.2rem; flex-shrink: 0; overflow: hidden;
        }
        .friend-av img { width: 100%; height: 100%; object-fit: cover; }
        .friend-info { flex: 1; min-width: 0; }
        .friend-name { color: var(--accent); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .friend-status { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .online-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; margin-right: 4px; }
        .friend-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
            font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn-msg { background: var(--accent); color: #000; }
        .btn-accept { background: var(--success); color: #fff; }
        .btn-reject { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-remove { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
        .search-results { padding: 0 16px; }
        .footer-dashboard {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-darker);
            border-top: 2px solid var(--gold); z-index: 300; max-width: 600px; margin: 0 auto;
            transition: transform 0.3s ease;
        }
        .footer-dashboard.collapsed { transform: translateY(calc(100% - 44px)); }
        .footer-handle { text-align: center; padding: 6px; cursor: pointer; }
        .footer-handle-bar { display: inline-block; width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; }
        .footer-paths { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 12px; gap: 4px; }
        .footer-path { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; padding: 6px 8px; border-radius: var(--radius-sm); transition: all 0.2s; min-width: 50px; }
        .footer-path:hover, .footer-path.active { color: var(--accent); background: rgba(173,216,230,0.1); }
        .footer-path-icon { font-size: 1.3rem; }
        .footer-path-label { font-size: 0.6rem; text-align: center; }
        .footer-muse-btn {
            width: 56px; height: 56px; border-radius: 50%; background: #000; border: 3px solid var(--gold);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5)); flex-shrink: 0; margin: 0 6px; padding: 0;
        }
        .footer-muse-btn:hover { transform: scale(1.1); }
        .footer-muse-btn svg { width: 30px; height: 30px; }
        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; z-index: 9999; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        @media (max-width: 480px) {
            .footer-muse-btn { width: 46px; height: 46px; }
            .footer-muse-btn svg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <header class="top-nav">
        <div class="nav-left">
            <button class="muse-menu-btn" id="museMenuBtn">
                <svg viewBox="0 0 40 40" class="nav-logo-icon">
                    <circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="1.5"/>
                    <text x="20" y="26" text-anchor="middle" font-family="Arial" font-weight="300" font-size="20" fill="#ADD8E6">M</text>
                </svg>
            </button>
            <ul class="dropdown-menu" id="dropdownMenu">
                <li><a href="centre.html">🏠 Centre</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
                <li><a href="friends.html">👫 Friends</a></li>
                <li><a href="messages.html">💬 Messages</a></li>
                <li><a href="slideshow.html">🎞️ Slideshow</a></li>
                <li><a href="media-uploads.html">📷 Uploads</a></li>
                <li><a href="settings.html">⚙️ Settings</a></li>
            </ul>
        </div>
        <div class="nav-center"><h1 class="page-title">Friends</h1></div>
        <div class="nav-right">
            <a href="messages.html" style="text-decoration:none;font-size:1.3rem;">💬</a>
        </div>
    </header>

    <div class="add-friend-bar">
        <input type="text" class="add-friend-input" id="addFriendInput" placeholder="Enter tag name to add friend...">
        <button class="btn-add" id="addFriendBtn">+ Add</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="myfriends">My Friends</button>
        <button class="tab-btn" data-tab="requests">Requests <span class="tab-badge" id="requestBadge" style="display:none;">0</span></button>
        <button class="tab-btn" data-tab="find">Find People</button>
    </div>

    <div id="friendsContainer">
        <div class="empty-state"><div class="empty-state-icon">👫</div><h3>Loading...</h3></div>
    </div>

</div>

<footer class="footer-dashboard collapsed" id="footerDashboard">
    <div class="footer-handle" id="footerHandle"><div class="footer-handle-bar"></div></div>
    <div class="footer-paths">
        <a href="profile.html" class="footer-path"><span class="footer-path-icon">👤</span><span class="footer-path-label">Profile</span></a>
        <a href="media-uploads.html" class="footer-path"><span class="footer-path-icon">📷</span><span class="footer-path-label">Uploads</span></a>
        <button class="footer-muse-btn" onclick="window.location.href='centre.html'" title="Centre">
            <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="2"/><text x="20" y="27" text-anchor="middle" font-family="Arial" font-weight="300" font-size="22" fill="#ADD8E6">M</text></svg>
        </button>
        <a href="friends.html" class="footer-path active"><span class="footer-path-icon">👫</span><span class="footer-path-label">Friends</span></a>
        <a href="slideshow.html" class="footer-path"><span class="footer-path-icon">🎞️</span><span class="footer-path-label">Slideshow</span></a>
    </div>
</footer>

<div id="toast"></div>

<script>
var API_BASE = 'http://localhost:3000/api';
var currentUser = null;
var currentTab = 'myfriends';

document.addEventListener('DOMContentLoaded', function() {
    var stored = localStorage.getItem('muse_user');
    if (!stored) { window.location.href = 'index.html'; return; }
    currentUser = JSON.parse(stored);
    setupUI();
    loadMyFriends();
});

function setupUI() {
    document.getElementById('museMenuBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('dropdownMenu').classList.toggle('show');
    });
    document.addEventListener('click', function() { document.getElementById('dropdownMenu').classList.remove('show'); });
    
    document.getElementById('addFriendBtn').addEventListener('click', addFriend);
    document.getElementById('addFriendInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') addFriend(); });
    
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentTab = this.dataset.tab;
            if (currentTab === 'myfriends') loadMyFriends();
            else if (currentTab === 'requests') loadRequests();
            else if (currentTab === 'find') showFindPeople();
        });
    });
    
    document.getElementById('footerHandle').addEventListener('click', function() { document.getElementById('footerDashboard').classList.toggle('collapsed'); });
    var startY = 0;
    var footer = document.getElementById('footerDashboard');
    footer.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; });
    footer.addEventListener('touchmove', function(e) {
        var diff = startY - e.touches[0].clientY;
        if (diff > 30) footer.classList.remove('collapsed');
        else if (diff < -30) footer.classList.add('collapsed');
    });
}

function loadMyFriends() {
    var container = document.getElementById('friendsContainer');
    fetch(API_BASE + '/friends/' + currentUser.id)
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success && result.friends.length > 0) {
                container.innerHTML = result.friends.map(function(f) {
                    return '<div class="friend-card">' +
                        '<div class="friend-av">' + (f.avatar ? '<img src="' + f.avatar + '" alt="' + f.tag_name + '">' : f.tag_name[0].toUpperCase()) + '</div>' +
                        '<div class="friend-info">' +
                            '<div class="friend-name">@' + f.tag_name + ' <span>' + (f.country_flag || '') + '</span></div>' +
                            '<div class="friend-status">' + (f.is_online ? '<span class="online-dot"></span>Online' : 'Offline') + ' · Friends since ' + new Date(f.friends_since).toLocaleDateString() + '</div>' +
                        '</div>' +
                        '<div class="friend-actions">' +
                            '<button class="btn-icon btn-msg" onclick="window.location.href=\'messages.html?friend=' + f.id + '\'" title="Message">💬</button>' +
                            '<button class="btn-icon btn-remove" onclick="removeFriend(\'' + f.id + '\')" title="Remove">✕</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            } else {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👫</div><h3>No friends yet</h3><p>Add friends to see their posts in your feed!</p></div>';
            }
        });
}

function loadRequests() {
    var container = document.getElementById('friendsContainer');
    fetch(API_BASE + '/notifications/' + currentUser.id)
        .then(function(r) { return r.json(); })
        .then(function(result) {
            var requests = [];
            if (result.success && result.notifications) {
                requests = result.notifications.filter(function(n) { return n.type === 'friend_request'; });
            }
            document.getElementById('requestBadge').textContent = requests.length;
            document.getElementById('requestBadge').style.display = requests.length > 0 ? 'inline' : 'none';
            
            if (requests.length > 0) {
                container.innerHTML = requests.map(function(n) {
                    return '<div class="friend-card">' +
                        '<div class="friend-av">' + (n.from_tag_name || '?')[0].toUpperCase() + '</div>' +
                        '<div class="friend-info"><div class="friend-name">@' + (n.from_tag_name || 'unknown') + '</div><div class="friend-status">Wants to be your friend</div></div>' +
                        '<div class="friend-actions">' +
                            '<button class="btn-icon btn-accept" onclick="respondRequest(\'' + n.from_user_id + '\', \'accept\')" title="Accept">✓</button>' +
                            '<button class="btn-icon btn-reject" onclick="respondRequest(\'' + n.from_user_id + '\', \'reject\')" title="Reject">✕</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            } else {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><h3>No pending requests</h3></div>';
            }
        });
}

function showFindPeople() {
    var container = document.getElementById('friendsContainer');
    container.innerHTML = '<div style="padding:0 16px 12px;"><input type="text" id="searchPeopleInput" class="add-friend-input" placeholder="Search by tag name..." style="width:100%;"></div><div class="search-results" id="searchResults"><div class="empty-state"><div class="empty-state-icon">🔍</div><h3>Find People</h3><p>Search for users by their tag name</p></div></div>';
    
    document.getElementById('searchPeopleInput').addEventListener('input', debounce(searchPeople, 300));
    document.getElementById('searchPeopleInput').focus();
}

function searchPeople() {
    var q = document.getElementById('searchPeopleInput').value.trim();
    var container = document.getElementById('searchResults');
    if (!q) { container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h3>Find People</h3><p>Search for users by their tag name</p></div>'; return; }
    
    fetch(API_BASE + '/search?q=' + encodeURIComponent(q))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success && result.users.length > 0) {
                container.innerHTML = result.users.filter(function(u) { return u.id !== currentUser.id; }).map(function(u) {
                    return '<div class="friend-card" style="margin:0 0 8px 0;">' +
                        '<div class="friend-av">' + (u.avatar ? '<img src="' + u.avatar + '">' : u.tag_name[0].toUpperCase()) + '</div>' +
                        '<div class="friend-info"><div class="friend-name">@' + u.tag_name + ' <span>' + (u.country_flag || '') + '</span></div></div>' +
                        '<button class="btn-add" onclick="addFriendByName(\'' + u.tag_name + '\')" style="padding:8px 16px;font-size:0.8rem;">+ Add</button>' +
                    '</div>';
                }).join('');
            } else {
                container.innerHTML = '<div class="empty-state"><p>No users found</p></div>';
            }
        });
}

function addFriend() {
    var tagName = document.getElementById('addFriendInput').value.trim();
    if (!tagName) return;
    fetch(API_BASE + '/friends/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, friendTagName: tagName })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.success) { document.getElementById('addFriendInput').value = ''; showToast('Friend request sent! ✅'); }
        else { showToast(result.error || 'Failed'); }
    });
}

function addFriendByName(tagName) {
    fetch(API_BASE + '/friends/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, friendTagName: tagName })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        showToast(result.success ? 'Friend request sent! ✅' : (result.error || 'Failed'));
    });
}

function respondRequest(fromUserId, action) {
    fetch(API_BASE + '/friends/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, friendId: fromUserId, action: action })
    }).then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.success) { showToast(action === 'accept' ? 'Friend added! 🎉' : 'Request rejected'); loadRequests(); loadMyFriends(); }
    });
}

function removeFriend(friendId) {
    if (!confirm('Remove this friend?')) return;
    fetch(API_BASE + '/friends/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, friendId: friendId, action: 'reject' })
    }).then(function(r) { return r.json(); })
    .then(function(result) { if (result.success) { showToast('Friend removed'); loadMyFriends(); } });
}

function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 3000);
}

function debounce(func, wait) {
    var timeout;
    return function() {
        var args = arguments;
        var context = this;
        clearTimeout(timeout);
        timeout = setTimeout(function() { func.apply(context, args); }, wait);
    };
}
</script>
</body>
</html>
