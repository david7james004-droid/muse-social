<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#808080">
    <title>Muse Social-Media</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #808080;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .welcome-container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }
        .logo-circle {
            width: 150px;
            height: 150px;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .app-title {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-size: 2.5rem;
            font-weight: 300;
            color: #ADD8E6;
            letter-spacing: 4px;
            margin-bottom: 0.25rem;
        }
        .company-branding {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .amusement {
            font-size: 1.2rem;
            color: #FFFFFF;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .inc {
            font-size: 0.8rem;
            color: #D3D3D3;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .sponsor {
            font-size: 0.7rem;
            color: #ADD8E6;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        .whale {
            font-size: 1.5rem;
        }
        .tagline {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .btn-enter {
            display: block;
            width: 100%;
            padding: 1rem;
            border: 2px solid #ADD8E6;
            border-radius: 50px;
            background: transparent;
            color: #ADD8E6;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-enter:hover {
            background: #ADD8E6;
            color: #000;
        }
        .btn-enter:active {
            transform: scale(0.97);
        }
        .footer-text {
            font-size: 0.7rem;
            color: #999;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo-circle">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="ys" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.8"/>
                    </filter>
                </defs>
                <circle cx="100" cy="100" r="95" fill="#000000" filter="url(#ys)"/>
                <text x="100" y="115" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="110" fill="#ADD8E6" letter-spacing="-2">M</text>
                <path id="cp" d="M 30 145 A 65 65 0 0 0 170 145" fill="transparent"/>
                <text font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ADD8E6" font-weight="300" letter-spacing="1">
                    <textPath href="#cp" startOffset="50%" text-anchor="middle">Muse Social Media 2026</textPath>
                </text>
            </svg>
        </div>
        
        <h1 class="app-title">Muse</h1>
        
        <div class="company-branding">
            <span class="amusement">Amusement</span>
            <span class="inc">Inc.</span>
        </div>
        
        <div class="sponsor">
            <span class="whale">🐋</span> Sponsored by The Blue Whale Family <span class="whale">🐋</span>
        </div>
        
        <p class="tagline">Share moments. Scroll endlessly.<br>Connect with friends.</p>
        
        <a href="centre.html" class="btn-enter" id="enterBtn">Enter Muse</a>
        
        <p class="footer-text">&copy; 2026 Muse Social-Media by Amusement Inc. All rights reserved.</p>
    </div>

    <script>
        (function() {
            var user = localStorage.getItem('muse_user');
            
            if (!user) {
                var adjectives = ['Cool', 'Funky', 'Mighty', 'Swift', 'Golden', 'Cosmic', 'Neon', 'Pixel', 'Astro', 'Turbo', 'Crystal', 'Silver', 'Blue', 'Wild', 'Epic'];
                var nouns = ['Fox', 'Bear', 'Wolf', 'Eagle', 'Tiger', 'Phoenix', 'Dragon', 'Hawk', 'Lynx', 'Raven', 'Whale', 'Dolphin', 'Falcon', 'Panther', 'Jaguar'];
                var randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
                var randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
                var randomNum = Math.floor(Math.random() * 999);
                var tagName = randomAdj + randomNoun + randomNum;
                var userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                var newUser = {
                    id: userId,
                    tag_name: tagName,
                    country_flag: '',
                    avatar: '',
                    bio: '',
                    muse_coins: 100,
                    created_at: new Date().toISOString()
                };
                
                localStorage.setItem('muse_user', JSON.stringify(newUser));
                
                fetch('http://localhost:3000/api/auto-register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                }).catch(function() {});
            }
        })();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                window.location.href = 'centre.html';
            }
        });
    </script>
</body>
</html>
