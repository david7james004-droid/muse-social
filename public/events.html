<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#808080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Events | Muse</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root { --bg: #808080; --bg-dark: #606060; --bg-darker: #404040; --bg-card: rgba(0,0,0,0.2); --text: #FFFFFF; --text-muted: #999999; --accent: #ADD8E6; --gold: #FFD700; --danger: #FF6B6B; --success: #4CAF50; --radius: 16px; --radius-sm: 8px; --footer-height: 70px; --nav-height: 50px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: calc(var(--footer-height) + 100px); }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-dark); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); height: var(--nav-height); }
        .nav-left { position: relative; }
        .muse-menu-btn { background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-logo-icon { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--bg-darker); border-radius: var(--radius-sm); min-width: 200px; max-height: 350px; overflow-y: auto; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); list-style: none; }
        .dropdown-menu.show { display: block; }
        .dropdown-menu li a { display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
        .dropdown-menu li a:hover { background: var(--accent); color: #000; }
        .nav-center .page-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
        .nav-right { display: flex; gap: 12px; align-items: center; }
        .nav-icon { text-decoration: none; font-size: 1.3rem; position: relative; }
        .notification-dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; }
        .notification-dot.has-unread { display: block; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .btn-primary { padding: 10px 24px; background: var(--accent); color: #000; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.9rem; font-family: inherit; display: block; margin: 12px 16px; }
        .form-box { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px; margin: 0 16px 12px; display: none; }
        .form-box input, .form-box textarea { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.08); border: 2px solid #666; border-radius: 10px; color: #fff; font-size: 0.85rem; font-family: inherit; outline: none; margin-bottom: 8px; resize: vertical; }
        .form-box input:focus, .form-box textarea:focus { border-color: var(--accent); }
        .event-card { background: var(--bg-card); border-radius: var(--radius-sm); overflow: hidden; margin: 0 16px 10px; position: relative; }
        .event-img { width: 100%; height: 120px; object-fit: cover; background: linear-gradient(135deg,rgba(173,216,230,0.1),rgba(255,215,0,0.1)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
        .event-body { padding: 12px; }
        .event-title { font-weight: 600; color: #fff; font-size: 0.9rem; }
        .event-desc { font-size: 0.75rem; color: #bbb; margin: 4px 0; }
        .event-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.65rem; color: #aaa; margin: 6px 0; }
        .event-meta span { background: rgba(255,255,255,0.04); padding: 3px 8px; border-radius: 10px; }
        .event-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04); }
        .event-count { font-size: 0.7rem; color: var(--accent); }
        .btn-rsvp { padding: 6px 18px; border-radius: 14px; font-size: 0.7rem; cursor: pointer; font-weight: 600; border: none; font-family: inherit; }
        .btn-going { background: rgba(76,175,80,0.2); color: var(--success); border: 1px solid rgba(76,175,80,0.3); }
        .btn-attend { background: var(--accent); color: #000; }
        .event-delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,107,107,0.7); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .footer-dashboard { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-darker); border-top: 2px solid var(--gold); z-index: 300; max-width: 600px; margin: 0 auto; transition: transform 0.3s ease; }
        .footer-dashboard.collapsed { transform: translateY(calc(100% - 44px)); }
        .footer-handle { text-align: center; padding: 6px; cursor: pointer; }
        .footer-handle-bar { display: inline-block; width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; }
        .footer-paths { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 12px; gap: 4px; }
        .footer-path { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; padding: 6px 8px; border-radius: var(--radius-sm); transition: all 0.2s; min-width: 50px; }
        .footer-path:hover, .footer-path.active { color: var(--accent); background: rgba(173,216,230,0.1); }
        .footer-path-icon { font-size: 1.3rem; }
        .footer-path-label { font-size: 0.6rem; text-align: center; }
        .footer-muse-btn { width: 56px; height: 56px; border-radius: 50%; background: #000; border: 3px solid var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 10px rgba(255,215,0,0.5)); flex-shrink: 0; margin: 0 6px; padding: 0; }
        .footer-muse-btn:hover { transform: scale(1.1); }
        .footer-muse-btn svg { width: 30px; height: 30px; }
        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; z-index: 9999; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
        @media (max-width: 480px) { .footer-muse-btn { width: 46px; height: 46px; } .footer-muse-btn svg { width: 24px; height: 24px; } }
    </style>
</head>
<body>
<div class="app-container">
    <header class="top-nav">
        <div class="nav-left">
            <button class="muse-menu-btn" id="museMenuBtn"><svg viewBox="0 0 40 40" class="nav-logo-icon"><circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Arial" font-weight="300" font-size="20" fill="#ADD8E6">M</text></svg></button>
            <ul class="dropdown-menu" id="dropdownMenu">
                <li><a href="centre.html">🏠 Centre</a></li><li><a href="hot.html">🔥 Hot</a></li><li><a href="profile.html">👤 Profile</a></li><li><a href="friends.html">👫 Friends</a></li><li><a href="messages.html">💬 Messages</a></li><li><a href="notifications.html">🔔 Notifications</a></li><li><a href="slideshow.html">🎞️ Slideshow</a></li><li><a href="wallet.html">💰 Wallet</a></li><li><a href="groups.html">👥 Groups</a></li><li><a href="events.html">🎫 Events</a></li><li><a href="polls.html">📊 Polls</a></li><li><a href="stories.html">📖 Stories</a></li><li><a href="search.html">🔍 Search</a></li><li><a href="media-uploads.html">📷 Uploads</a></li><li><a href="settings.html">⚙️ Settings</a></li>
            </ul>
        </div>
        <div class="nav-center"><h1 class="page-title">🎫 Events</h1></div>
        <div class="nav-right"><a href="messages.html" class="nav-icon" id="msgIcon">💬<span class="notification-dot" id="msgDot"></span></a><a href="notifications.html" class="nav-icon" id="notifIcon">🔔<span class="notification-dot" id="notifDot"></span></a></div>
    </header>

    <button class="btn-primary" id="toggleFormBtn">+ Create Event</button>
    <div class="form-box" id="eventForm">
        <input type="text" id="ename" placeholder="Event name *"><textarea id="edesc" rows="2" placeholder="Description"></textarea><input type="datetime-local" id="edate"><input type="text" id="eloc" placeholder="Location"><button class="btn-primary" id="postEventBtn" style="width:100%;margin:0;">Post Event</button>
    </div>
    <div id="eventsList"><div style="text-align:center;color:var(--text-muted);padding:40px;">Loading events...</div></div>
</div>

<footer class="footer-dashboard collapsed" id="footerDashboard">
    <div class="footer-handle" id="footerHandle"><div class="footer-handle-bar"></div></div>
    <div class="footer-paths">
        <a href="profile.html" class="footer-path"><span class="footer-path-icon">👤</span><span class="footer-path-label">Profile</span></a>
        <a href="media-uploads.html" class="footer-path"><span class="footer-path-icon">📷</span><span class="footer-path-label">Uploads</span></a>
        <button class="footer-muse-btn" onclick="window.location.href='centre.html'"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="2"/><text x="20" y="27" text-anchor="middle" font-family="Arial" font-weight="300" font-size="22" fill="#ADD8E6">M</text></svg></button>
        <a href="friends.html" class="footer-path"><span class="footer-path-icon">👫</span><span class="footer-path-label">Friends</span></a>
        <a href="slideshow.html" class="footer-path"><span class="footer-path-icon">🎞️</span><span class="footer-path-label">Slideshow</span></a>
    </div>
</footer>
<div id="toast"></div>

<script>
var API_BASE = '/api'; var currentUser = null;
document.addEventListener('DOMContentLoaded', function() { var stored = localStorage.getItem('muse_user'); if (!stored) { window.location.href = 'index.html'; return; } currentUser = JSON.parse(stored); setupUI(); loadEvents(); checkUnread(); setInterval(checkUnread, 15000); });
function setupUI() { document.getElementById('museMenuBtn').addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); }); document.addEventListener('click', function() { document.getElementById('dropdownMenu').classList.remove('show'); }); document.getElementById('toggleFormBtn').addEventListener('click', function() { var f = document.getElementById('eventForm'); f.style.display = f.style.display === 'block' ? 'none' : 'block'; if (f.style.display === 'block') { var d = new Date(); d.setDate(d.getDate()+1); d.setHours(18,0,0,0); document.getElementById('edate').value = d.toISOString().slice(0,16); } }); document.getElementById('postEventBtn').addEventListener('click', createEvent); document.getElementById('footerHandle').addEventListener('click', function() { document.getElementById('footerDashboard').classList.toggle('collapsed'); }); var startY = 0, footer = document.getElementById('footerDashboard'); footer.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; }); footer.addEventListener('touchmove', function(e) { var diff = startY - e.touches[0].clientY; if (diff > 30) footer.classList.remove('collapsed'); else if (diff < -30) footer.classList.add('collapsed'); }); }
function checkUnread() { fetch(API_BASE+'/notifications/'+currentUser.id).then(function(r){return r.json();}).then(function(r){var d=document.getElementById('notifDot');if(r.unread>0)d.classList.add('has-unread');else d.classList.remove('has-unread');}); fetch(API_BASE+'/conversations/'+currentUser.id).then(function(r){return r.json();}).then(function(r){var d=document.getElementById('msgDot');if(r.success&&r.conversations){var t=r.conversations.reduce(function(s,c){return s+(c.unread||0);},0);if(t>0)d.classList.add('has-unread');else d.classList.remove('has-unread');}}); }
function loadEvents() { fetch(API_BASE + '/events').then(function(r) { return r.json(); }).then(function(result) { var container = document.getElementById('eventsList'); console.log('Events loaded:', result); if (result.success && result.events && result.events.length) { container.innerHTML = result.events.map(function(e) { var going = e.attendees && e.attendees.indexOf(currentUser.id) > -1; var count = e.attendees ? e.attendees.length : 0; var d = new Date(e.event_date); if (isNaN(d.getTime())) { d = new Date(); } var ds = d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); var ts = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); var isOwner = e.user_id === currentUser.id; return '<div class="event-card">' + (isOwner ? '<button class="event-delete-btn" onclick="event.stopPropagation();deleteEvent(\''+e.id+'\')">✕</button>' : '') + '<div class="event-img">🎫</div><div class="event-body"><div class="event-title">'+escHtml(e.title)+'</div>'+(e.description?'<div class="event-desc">'+escHtml(e.description.substring(0,120))+'</div>':'')+'<div class="event-meta"><span>📅 '+ds+'</span><span>🕐 '+ts+'</span><span>📍 '+escHtml(e.location||'TBA')+'</span></div><div class="event-foot"><span class="event-count">🎟️ '+count+' attending</span><button class="btn-rsvp '+(going?'btn-going':'btn-attend')+'" onclick="rsvp(\''+e.id+'\')">'+(going?'✅ Going':'🎟️ Attend')+'</button></div></div></div>'; }).join(''); } else { container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;">No upcoming events. Create one!</div>'; } }).catch(function(err) { console.error('Events error:', err); }); }
function createEvent() { var title = document.getElementById('ename').value.trim(); var desc = document.getElementById('edesc').value.trim(); var date = document.getElementById('edate').value; var loc = document.getElementById('eloc').value.trim(); if (!title) { showToast('Enter event name'); return; } if (!date) { showToast('Pick a date'); return; } var isoDate = new Date(date).toISOString(); console.log('Creating event:', { title: title, eventDate: isoDate }); var btn = document.getElementById('postEventBtn'); btn.disabled = true; btn.textContent = 'Posting...'; fetch(API_BASE + '/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, title: title, description: desc, eventDate: isoDate, location: loc }) }).then(function(r) { return r.json(); }).then(function(result) { console.log('Event result:', result); if (result.success) { document.getElementById('eventForm').style.display = 'none'; document.getElementById('ename').value=''; document.getElementById('edesc').value=''; document.getElementById('eloc').value=''; loadEvents(); showToast('Event created! 🎫'); } else { showToast(result.error || 'Failed to create event'); } btn.disabled = false; btn.textContent = 'Post Event'; }).catch(function(err) { console.error('Event error:', err); showToast('Network error'); btn.disabled = false; btn.textContent = 'Post Event'; }); }
function rsvp(eventId) { fetch(API_BASE + '/events/' + eventId + '/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id }) }).then(function(r) { return r.json(); }).then(function(result) { if (result.success) { loadEvents(); showToast(result.going ? 'See you there! 🎉' : 'RSVP cancelled'); } }); }
function deleteEvent(eventId) { if (!confirm('Delete this event?')) return; fetch(API_BASE + '/events/' + eventId, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id }) }).then(function(r) { return r.json(); }).then(function(result) { if (result.success) { loadEvents(); showToast('Event deleted 🗑️'); } else { showToast(result.error || 'Cannot delete'); } }); }
function escHtml(t) { if(!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; setTimeout(function() { t.style.opacity = '0'; }, 3000); }
</script>
</body>
</html>
