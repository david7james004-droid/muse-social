<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Slideshow | Muse</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root { --bg: #000; --text: #FFFFFF; --text-muted: #999999; --accent: #ADD8E6; --gold: #FFD700; --danger: #FF6B6B; --success: #4CAF50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; }
        .filter-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 10px 12px; display: flex; align-items: center; gap: 8px; max-width: 600px; margin: 0 auto; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid #555; background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.75rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; font-family: inherit; }
        .filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .filter-more-btn { border-color: var(--gold); color: var(--gold); }
        .filter-expanded { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.8); position: fixed; top: 44px; left: 0; right: 0; z-index: 99; max-width: 600px; margin: 0 auto; }
        .slides-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .slide { scroll-snap-align: start; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
        .slide-media { width: 100%; height: 100%; object-fit: contain; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 80px 16px 100px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: none; z-index: 5; }
        .slide-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; pointer-events: auto; }
        .slide-av { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 1rem; overflow: hidden; border: 2px solid var(--gold); }
        .slide-av img { width: 100%; height: 100%; object-fit: cover; }
        .slide-username { font-weight: 600; font-size: 0.9rem; cursor: pointer; pointer-events: auto; }
        .slide-flag { font-size: 0.8rem; }
        .slide-text { font-size: 0.85rem; color: #ddd; line-height: 1.4; }
        .slide-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
        .slide-tag { background: rgba(173,216,230,0.2); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        .slide-actions-left { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 10; opacity: 0; transition: opacity 0.3s; }
        .slide:hover .slide-actions-left, .slide.touched .slide-actions-left { opacity: 1; }
        .slide-action-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: #fff; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .slide-action-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.15); }
        .slide-action-btn.liked { color: #FF6B6B; border-color: #FF6B6B; background: rgba(255,107,107,0.3); }
        .slide-action-btn.bookmarked { color: var(--gold); border-color: var(--gold); background: rgba(255,215,0,0.3); }
        .action-count { font-size: 0.65rem; color: #fff; text-align: center; margin-top: -10px; }
        .sound-indicator { position: absolute; top: 60px; right: 16px; z-index: 20; background: rgba(0,0,0,0.6); color: #fff; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; }
        .nav-arrow { position: fixed; right: 20px; z-index: 50; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .nav-up { top: 80px; } .nav-down { bottom: 160px; }
        .back-btn { position: fixed; top: 12px; left: 60px; z-index: 150; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .slide-counter { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 150; color: #fff; font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px; }
        .slide-empty { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; padding: 40px; text-align: center; }
        .slide-empty-icon { font-size: 4rem; margin-bottom: 16px; }
        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; z-index: 9999; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

<div class="filter-bar" id="filterBar">
    <button class="back-btn" onclick="window.location.href='centre.html'" style="position:static;flex-shrink:0;">←</button>
    <button class="filter-chip active" data-tag="all">All</button><button class="filter-chip" data-tag="trending">🔥 Trending</button><button class="filter-chip" data-tag="comedy">Comedy</button><button class="filter-chip" data-tag="funny">Funny</button><button class="filter-chip" data-tag="news">News</button><button class="filter-chip" data-tag="animals">Animals</button><button class="filter-chip" data-tag="sports">Sports</button><button class="filter-chip" data-tag="music">Music</button><button class="filter-chip" data-tag="food">Food</button><button class="filter-chip filter-more-btn" id="filterMoreBtn">More ▼</button>
</div>
<div class="filter-expanded" id="filterExpanded">
    <button class="filter-chip" data-tag="gaming">Gaming</button><button class="filter-chip" data-tag="fashion">Fashion</button><button class="filter-chip" data-tag="nature">Nature</button><button class="filter-chip" data-tag="hollywood">Hollywood</button><button class="filter-chip" data-tag="nfl">NFL</button><button class="filter-chip" data-tag="nba">NBA</button><button class="filter-chip" data-tag="football">Football</button><button class="filter-chip" data-tag="rugby">Rugby</button><button class="filter-chip" data-tag="f1">F1</button><button class="filter-chip" data-tag="tennis">Tennis</button><button class="filter-chip" data-tag="workout">Work-Out</button><button class="filter-chip" data-tag="diy">DIY</button><button class="filter-chip" data-tag="garden">Garden</button><button class="filter-chip" data-tag="beauty">Beauty</button><button class="filter-chip" data-tag="pets">Pets</button><button class="filter-chip" data-tag="tech">Tech</button><button class="filter-chip" data-tag="travel">Travel</button><button class="filter-chip" data-tag="horror">Horror</button><button class="filter-chip" data-tag="action">Action</button><button class="filter-chip" data-tag="thriller">Thriller</button><button class="filter-chip" data-tag="celebs">Celebs</button><button class="filter-chip" data-tag="motorsport">Motor-Sport</button><button class="filter-chip" data-tag="shopping">Shopping</button><button class="filter-chip" data-tag="hockey">Hockey</button>
</div>

<div class="slide-counter" id="slideCounter">1 / 0</div>
<button class="nav-arrow nav-up" id="navUp">▲</button>
<button class="nav-arrow nav-down" id="navDown">▼</button>

<div class="slides-container" id="slidesContainer"><div class="slide-empty"><div class="slide-empty-icon">🎞️</div><h2>Loading slides...</h2><p>Content from friends appears here</p></div></div>
<div id="toast"></div>

<script>
var API_BASE = '/api'; var currentUser = null; var allPosts = []; var currentSlideIndex = 0; var activeFilter = 'all';
document.addEventListener('DOMContentLoaded', function() { var stored = localStorage.getItem('muse_user'); if (!stored) { window.location.href = 'index.html'; return; } currentUser = JSON.parse(stored); setupUI(); loadSlides(); document.addEventListener('keydown', function(e) { if (e.key === 'ArrowDown' || e.key === 'j') nextSlide(); if (e.key === 'ArrowUp' || e.key === 'k') prevSlide(); if (e.key === 'Escape') window.location.href = 'centre.html'; }); });
function setupUI() { document.querySelectorAll('#filterBar .filter-chip, #filterExpanded .filter-chip').forEach(function(chip) { if (chip.id === 'filterMoreBtn') return; chip.addEventListener('click', function() { document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); }); this.classList.add('active'); activeFilter = this.dataset.tag; document.getElementById('filterExpanded').style.display = 'none'; document.getElementById('filterMoreBtn').textContent = 'More ▼'; filterSlides(); }); }); document.getElementById('filterMoreBtn').addEventListener('click', function() { var expanded = document.getElementById('filterExpanded'); if (expanded.style.display === 'none' || expanded.style.display === '') { expanded.style.display = 'flex'; this.textContent = 'Less ▲'; } else { expanded.style.display = 'none'; this.textContent = 'More ▼'; } }); document.getElementById('navUp').addEventListener('click', prevSlide); document.getElementById('navDown').addEventListener('click', nextSlide); var container = document.getElementById('slidesContainer'); var scrollTimeout; container.addEventListener('scroll', function() { clearTimeout(scrollTimeout); scrollTimeout = setTimeout(function() { currentSlideIndex = Math.round(container.scrollTop / window.innerHeight); updateCounter(); playCurrentVideo(); }, 150); }); var touchStartY = 0; container.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }); container.addEventListener('touchend', function(e) { var diff = touchStartY - e.changedTouches[0].clientY; if (Math.abs(diff) > 50) { if (diff > 0) nextSlide(); else prevSlide(); } }); }
function loadSlides() { var container = document.getElementById('slidesContainer'); fetch(API_BASE + '/posts?type=slideshow').then(function(r) { return r.json(); }).then(function(result) { if (result.success && result.posts && result.posts.length > 0) { allPosts = result.posts; filterSlides(); } else { fetch(API_BASE + '/posts').then(function(r) { return r.json(); }).then(function(allResult) { if (allResult.success && allResult.posts) { allPosts = allResult.posts.filter(function(p) { return p.media || p.slideshow; }); if (allPosts.length === 0) { container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">🎞️</div><h2>No slides yet</h2><p>Posts with media sent to slideshow appear here</p><button onclick="window.location.href=\'centre.html\'" style="margin-top:16px;padding:12px 32px;background:#ADD8E6;color:#000;border:none;border-radius:25px;cursor:pointer;font-weight:600;">Go to Centre</button></div>'; return; } filterSlides(); } }); } }).catch(function() { container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">⚠️</div><h2>Cannot load slides</h2><p>Make sure server is running</p><button onclick="loadSlides()" style="margin-top:12px;padding:10px 24px;background:#ADD8E6;color:#000;border:none;border-radius:20px;cursor:pointer;">Retry</button></div>'; }); }
function filterSlides() { var container = document.getElementById('slidesContainer'); var filtered = allPosts; if (activeFilter !== 'all') { filtered = allPosts.filter(function(p) { var text = (p.text || '').toLowerCase(); return text.indexOf('#' + activeFilter) !== -1 || text.indexOf(activeFilter) !== -1; }); } if (filtered.length === 0) { container.innerHTML = '<div class="slide-empty"><div class="slide-empty-icon">🔍</div><h2>No ' + activeFilter + ' content</h2><p>Try a different filter</p></div>'; return; } container.innerHTML = filtered.map(function(post, index) { var mediaFiles = post.media ? post.media.split(',') : []; var tags = (post.text || '').match(/#[\w-]+/g) || []; var locationMatch = (post.text || '').match(/📍\s*(.+)/); var location = locationMatch ? locationMatch[1] : ''; var isVideo = post.media_type === 'video'; return '<div class="slide" id="slide-' + index + '" onclick="toggleTouch(this)">' + (isVideo ? '<video class="slide-media" src="' + post.media + '" loop playsinline></video>' : mediaFiles[0] ? '<img class="slide-media" src="' + mediaFiles[0] + '" alt="Slide">' : '<div style="color:#999;text-align:center;padding:40px;">No media</div>') + (isVideo ? '<div class="sound-indicator" id="soundIcon-' + index + '" onclick="event.stopPropagation();toggleSound(\'slide-' + index + '\', this)">🔇</div>' : '') + '<div class="slide-actions-left"><div style="text-align:center;"><button class="slide-action-btn" onclick="event.stopPropagation();likePost(\'' + post.id + '\', this)">❤️</button><div class="action-count">' + (post.likes_count || 0) + '</div></div><div style="text-align:center;"><button class="slide-action-btn" onclick="event.stopPropagation();bookmarkPost(\'' + post.id + '\', this)">🔖</button></div><button class="slide-action-btn" onclick="event.stopPropagation();sharePost()">↗️</button><button class="slide-action-btn" onclick="event.stopPropagation();openComments(\'' + post.id + '\')">💬</button>' + (post.user_id === currentUser.id ? '<button class="slide-action-btn" onclick="event.stopPropagation();deleteSlide(\'' + post.id + '\')">🗑️</button>' : '') + '</div><div class="slide-overlay"><div class="slide-user-row" onclick="event.stopPropagation();window.location.href=\'profile.html?user=' + post.user_id + '\'" style="cursor:pointer;pointer-events:auto;"><div class="slide-av">' + (post.avatar ? '<img src="' + post.avatar + '">' : (post.tag_name || '?')[0].toUpperCase()) + '</div><div><div class="slide-username">@' + post.tag_name + ' <span class="slide-flag">' + (post.country_flag || '') + '</span></div></div></div><div class="slide-text">' + (post.text || '') + '</div>' + (tags.length > 0 ? '<div class="slide-tags">' + tags.map(function(t) { return '<span class="slide-tag">' + t + '</span>'; }).join('') + '</div>' : '') + (location ? '<div class="slide-location">📍 ' + location + '</div>' : '') + '</div></div>'; }).join(''); currentSlideIndex = 0; container.scrollTop = 0; updateCounter(); setTimeout(function() { playCurrentVideo(); }, 500); }
function toggleTouch(slide) { slide.classList.toggle('touched'); var video = slide.querySelector('video'); if (video) { if (video.paused) video.play().catch(function() {}); else video.pause(); } }
function toggleSound(slideId, icon) { var slide = document.getElementById(slideId); if (!slide) return; var video = slide.querySelector('video'); if (!video) return; video.muted = !video.muted; icon.textContent = video.muted ? '🔇' : '🔊'; }
function nextSlide() { var container = document.getElementById('slidesContainer'); var maxIndex = container.querySelectorAll('.slide').length - 1; if (currentSlideIndex < maxIndex) { currentSlideIndex++; container.scrollTo({ top: currentSlideIndex * window.innerHeight, behavior: 'smooth' }); updateCounter(); setTimeout(function() { playCurrentVideo(); }, 500); } }
function prevSlide() { if (currentSlideIndex > 0) { currentSlideIndex--; document.getElementById('slidesContainer').scrollTo({ top: currentSlideIndex * window.innerHeight, behavior: 'smooth' }); updateCounter(); setTimeout(function() { playCurrentVideo(); }, 500); } }
function playCurrentVideo() { document.querySelectorAll('.slide video').forEach(function(v) { v.pause(); }); var cs = document.getElementById('slide-' + currentSlideIndex); if (cs) { var video = cs.querySelector('video'); if (video) { video.muted = false; video.play().catch(function() {}); var icon = document.getElementById('soundIcon-' + currentSlideIndex); if (icon) icon.textContent = video.muted ? '🔇' : '🔊'; } } }
function updateCounter() { var total = document.querySelectorAll('.slide').length; document.getElementById('slideCounter').textContent = (currentSlideIndex + 1) + ' / ' + total; }
function likePost(postId, btn) { fetch(API_BASE + '/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, postId: postId }) }).then(function(r) { return r.json(); }).then(function(result) { if (result.success) { btn.classList.toggle('liked', result.liked); var ce = btn.parentElement.querySelector('.action-count'); if (ce) { var num = parseInt(ce.textContent) || 0; ce.textContent = result.liked ? num + 1 : Math.max(0, num - 1); } showToast(result.liked ? '❤️ Liked!' : 'Like removed'); } }); }
function bookmarkPost(postId, btn) { fetch(API_BASE + '/bookmarks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, postId: postId }) }).then(function(r) { return r.json(); }).then(function(result) { if (result.success) { btn.classList.toggle('bookmarked', result.bookmarked); showToast(result.bookmarked ? '🔖 Bookmarked!' : 'Bookmark removed'); } }); }
function sharePost() { if (navigator.share) { navigator.share({ title: 'Muse Post', url: window.location.href }); } else { showToast('Link copied!'); } }
function openComments(postId) { showToast('💬 Comments open on Centre page'); }
function deleteSlide(postId) { if (!confirm('Delete this post?')) return; fetch(API_BASE + '/posts/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, postId: postId }) }).then(function(r) { return r.json(); }).then(function(result) { if (result.success) { showToast('Deleted 🗑️'); loadSlides(); } }); }
function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; setTimeout(function() { t.style.opacity = '0'; }, 2000); }
</script>
</body>
</html>
