<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#808080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Notifications | Muse</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        :root { --bg: #808080; --bg-dark: #606060; --bg-darker: #404040; --bg-card: rgba(0,0,0,0.2); --text: #FFFFFF; --text-muted: #999999; --accent: #ADD8E6; --gold: #FFD700; --danger: #FF6B6B; --success: #4CAF50; --radius: 16px; --radius-sm: 8px; --footer-height: 70px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: calc(var(--footer-height) + 100px); }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-dark); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); height: 50px; }
        .nav-left { position: relative; }
        .muse-menu-btn { background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-logo-icon { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--bg-darker); border-radius: var(--radius-sm); min-width: 200px; max-height: 350px; overflow-y: auto; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); list-style: none; }
        .dropdown-menu.show { display: block; }
        .dropdown-menu li a { display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
        .dropdown-menu li a:hover { background: var(--accent); color: #000; }
        .nav-center .page-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
        .nav-right { display: flex; gap: 12px; align-items: center; }
        .mark-all-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; padding: 8px 16px; font-family: inherit; }
        .notif-list { padding: 8px 0; }
        .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .notif-item:hover { background: rgba(173,216,230,0.05); }
        .notif-item.unread { background: rgba(173,216,230,0.1); }
        .notif-icon { font-size: 1.5rem; flex-shrink: 0; width: 40px; text-align: center; }
        .notif-content { flex: 1; min-width: 0; }
        .notif-text { font-size: 0.9rem; color: var(--text); line-height: 1.4; }
        .notif-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
        .notif-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
        .footer-dashboard { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-darker); border-top: 2px solid var(--gold); z-index: 300; max-width: 600px; margin: 0 auto; transition: transform 0.3s ease; }
        .footer-dashboard.collapsed { transform: translateY(calc(100% - 44px)); }
        .footer-handle { text-align: center; padding: 6px; cursor: pointer; }
        .footer-handle-bar { display: inline-block; width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; }
        .footer-paths { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 12px; gap: 4px; }
        .footer-path { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; padding: 6px 8px; border-radius: var(--radius-sm); transition: all 0.2s; min-width: 50px; }
        .footer-path:hover { color: var(--accent); background: rgba(173,216,230,0.1); }
        .footer-path-icon { font-size: 1.3rem; }
        .footer-path-label { font-size: 0.6rem; text-align: center; }
        .footer-muse-btn { width: 56px; height: 56px; border-radius: 50%; background: #000; border: 3px solid var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 10px rgba(255,215,0,0.5)); flex-shrink: 0; margin: 0 6px; padding: 0; }
        .footer-muse-btn:hover { transform: scale(1.1); }
        .footer-muse-btn svg { width: 30px; height: 30px; }
        @media (max-width: 480px) { .footer-muse-btn { width: 46px; height: 46px; } .footer-muse-btn svg { width: 24px; height: 24px; } }
    </style>
</head>
<body>
<div class="app-container">
    <header class="top-nav">
        <div class="nav-left">
            <button class="muse-menu-btn" id="museMenuBtn"><svg viewBox="0 0 40 40" class="nav-logo-icon"><circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Arial" font-weight="300" font-size="20" fill="#ADD8E6">M</text></svg></button>
            <ul class="dropdown-menu" id="dropdownMenu">
                <li><a href="centre.html">🏠 Centre</a></li><li><a href="profile.html">👤 Profile</a></li><li><a href="friends.html">👫 Friends</a></li><li><a href="messages.html">💬 Messages</a></li><li><a href="notifications.html">🔔 Notifications</a></li><li><a href="slideshow.html">🎞️ Slideshow</a></li><li><a href="media-uploads.html">📷 Uploads</a></li><li><a href="settings.html">⚙️ Settings</a></li>
            </ul>
        </div>
        <div class="nav-center"><h1 class="page-title">Notifications</h1></div>
        <div class="nav-right"><button class="mark-all-btn" id="markAllRead">Mark all read</button></div>
    </header>
    <div class="notif-list" id="notifList"><div class="empty-state"><div class="empty-state-icon">🔔</div><h3>Loading...</h3></div></div>
</div>

<footer class="footer-dashboard collapsed" id="footerDashboard">
    <div class="footer-handle" id="footerHandle"><div class="footer-handle-bar"></div></div>
    <div class="footer-paths">
        <a href="profile.html" class="footer-path"><span class="footer-path-icon">👤</span><span class="footer-path-label">Profile</span></a>
        <a href="media-uploads.html" class="footer-path"><span class="footer-path-icon">📷</span><span class="footer-path-label">Uploads</span></a>
        <button class="footer-muse-btn" onclick="window.location.href='centre.html'"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#000" stroke="#FFD700" stroke-width="2"/><text x="20" y="27" text-anchor="middle" font-family="Arial" font-weight="300" font-size="22" fill="#ADD8E6">M</text></svg></button>
        <a href="friends.html" class="footer-path"><span class="footer-path-icon">👫</span><span class="footer-path-label">Friends</span></a>
        <a href="slideshow.html" class="footer-path"><span class="footer-path-icon">🎞️</span><span class="footer-path-label">Slideshow</span></a>
    </div>
</footer>

<script>
var API_BASE = '/api'; var currentUser = null;
document.addEventListener('DOMContentLoaded', function() { var stored = localStorage.getItem('muse_user'); if (!stored) { window.location.href = 'index.html'; return; } currentUser = JSON.parse(stored); setupUI(); loadNotifications(); });
function setupUI() { document.getElementById('museMenuBtn').addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); }); document.addEventListener('click', function() { document.getElementById('dropdownMenu').classList.remove('show'); }); document.getElementById('markAllRead').addEventListener('click', function() { fetch(API_BASE + '/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id }) }).then(function() { loadNotifications(); }); }); document.getElementById('footerHandle').addEventListener('click', function() { document.getElementById('footerDashboard').classList.toggle('collapsed'); }); var startY = 0; var footer = document.getElementById('footerDashboard'); footer.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; }); footer.addEventListener('touchmove', function(e) { var diff = startY - e.touches[0].clientY; if (diff > 30) footer.classList.remove('collapsed'); else if (diff < -30) footer.classList.add('collapsed'); }); }
function loadNotifications() {
    fetch(API_BASE + '/notifications/' + currentUser.id).then(function(r) { return r.json(); }).then(function(result) {
        var container = document.getElementById('notifList');
        if (result.success && result.notifications && result.notifications.length > 0) {
            container.innerHTML = result.notifications.map(function(n) {
                var icon = '🔔'; if (n.type === 'like') icon = '❤️'; else if (n.type === 'comment') icon = '💬'; else if (n.type === 'friend_request') icon = '👫';
                var clickAction = '';
                if (n.post_id) { clickAction = "window.location.href='centre.html'"; }
                else if (n.type === 'friend_request' && n.from_user_id) { clickAction = "window.location.href='profile.html?user=" + n.from_user_id + "'"; }
                else { clickAction = "markRead('" + n.id + "')"; }
                return '<div class="notif-item ' + (n.is_read ? '' : 'unread') + '" onclick="' + clickAction + '"><div class="notif-icon">' + icon + '</div><div class="notif-content"><div class="notif-text">' + n.text + '</div><div class="notif-time">' + timeAgo(n.created_at) + '</div></div>' + (n.is_read ? '' : '<div class="notif-dot"></div>') + '</div>';
            }).join('');
        } else { container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔔</div><h3>All caught up!</h3><p>No notifications yet</p></div>'; }
    });
}
function markRead(id) { fetch(API_BASE + '/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, notificationId: id }) }).then(function() { loadNotifications(); }); }
function timeAgo(d) { if (!d) return ''; var s = Math.floor((new Date() - new Date(d)) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
</script>
</body>
</html>
